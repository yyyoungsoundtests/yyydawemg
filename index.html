<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Эфир</title>
<meta name="description" content="Монтаж и сведение радиороликов: 4 дорожки, регионы 5/10/15/30, экспорт WAV и MP3">
<meta name="theme-color" content="#2A2C2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Эфир">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Тёмная тема в духе Reaper: серые панели, зелёный FX, бирюзовые регионы. Одна тема намеренно. */
:root {
  color-scheme: dark;
  --app: #242627; --bar: #343637; --bar2: #2B2D2E; --tcp: #3A3C3D; --tcp2: #333536; --line: #1A1B1C; --line2: #4A4D4F;
  --fg: #DADDDD; --dim: #8E9496; --accent: #62D6B9; --fxon: #47B464; --play: #F1F3F3; --bad: #FF6B57; --ok: #69C98F;
  --btn: #45484A; --btn2: #505456; --sel: #3D6E9E;
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--app); color: var(--fg); font: 13px/1.35 var(--f-ui); overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); } .ok { color: var(--ok); } .bad { color: var(--bad); }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto auto; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
/* toolbar */
.top { display: flex; align-items: center; gap: 4px; padding: 5px 8px; background: var(--bar); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.top::-webkit-scrollbar { display: none; }
.top > * { flex: none; }
#projName { background: var(--bar2); border: 1px solid var(--line2); border-radius: 3px; padding: 5px 10px; font-weight: 600; max-width: 24ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sep { width: 1px; height: 26px; background: var(--line2); margin: 0 4px; }
.tb { min-width: 34px; height: 32px; padding: 0 9px; border: 1px solid transparent; border-radius: 3px; background: transparent; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 12.5px; white-space: nowrap; }
.tb:hover { background: rgba(255,255,255,.07); border-color: var(--line2); }
.tb:disabled { opacity: .35; }
.tb.on { background: #2F5A4E; border-color: #4E8E7C; color: #CFF3E9; }
.tb svg { width: 17px; height: 17px; }
.tb.primary { background: #3E7F6D; border-color: #5BA48F; color: #fff; font-weight: 600; }
.spacer { flex: 1; }

/* main area */
.main { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 0; }
#heads { background: var(--tcp2); border-right: 1px solid var(--line); overflow: hidden; overflow: clip; min-width: 0; }
.tcpTop { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; background: #2A2C2D; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 11px; }
.tcpTop span { font-weight: 600; color: var(--fg); }
.tcp { display: grid; grid-template-columns: 20px 1fr 28px; border-bottom: 1px solid var(--line); background: var(--tcp); box-shadow: inset 3px 0 0 var(--tc); }
.tcp.muted { background: #343536; }
#heads.compact .tcp:not(.master) .trow.sub { display: none; }
#heads.compact .tmain { gap: 3px; padding-block: 3px; }
.tcp.master { background: #2E3032; box-shadow: inset 3px 0 0 #E8E4DA; border-top: 2px solid #121314; }
.tcp.master .tnum { color: #E8E4DA; font-weight: 700; }
.tcp.master .tname { letter-spacing: .08em; }
.addtrack { margin-left: auto; height: 28px; padding: 0 10px; border: 1px solid #3E7F6D; border-radius: 3px; background: #24332F; color: var(--accent); font-weight: 600; font-size: 12px; }
.addtrack:hover { background: #303334; }
.delb { width: 24px; height: 22px; border-radius: 3px; border: 1px solid var(--line); background: var(--btn); color: #FF9A8C; font-size: 15px; line-height: 1; flex: none; }
.tnamein { flex: 1; min-width: 0; font-size: 12.5px; }
.btns.col { flex-direction: column; align-items: stretch; }
.btns.col .btn { white-space: normal; text-align: left; }
.monob { height: 22px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--line); background: var(--btn); font: 700 9.5px var(--f-ui); letter-spacing: .04em; color: #B9BDBE; flex: none; }
.monob.on { background: #3D6E9E; color: #fff; border-color: #5A8EC2; }
.mmtr { flex: 1; min-width: 0; height: 14px; display: block; }
.tcp.muted .tname { opacity: .5; }
.tnum { display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 11px; background: rgba(0,0,0,.12); }
.tmain { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 5px 6px; min-width: 0; }
.trow { display: flex; align-items: center; gap: 5px; min-width: 0; }
.trow.sub { gap: 8px; font-size: 10.5px; color: var(--dim); }
.tname { flex: 1; min-width: 0; text-align: left; background: #2C2E2F; border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fxb { width: 34px; height: 26px; border-radius: 3px; border: 1px solid var(--line); background: var(--btn); font-size: 11px; font-weight: 700; color: #B9BDBE; }
.fxb.act { background: #2F6B3F; color: #D6F5DE; border-color: #48A160; box-shadow: inset 0 -3px 0 #5BD27C; }
.addb { width: 28px; height: 26px; border-radius: 3px; border: 1px solid var(--line); background: var(--btn); font-size: 17px; line-height: 1; color: var(--tc); }
.tms { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-right: 4px; }
.ms { width: 24px; height: 22px; border-radius: 3px; border: 1px solid var(--line); background: var(--btn); font: 700 10.5px var(--f-ui); color: #B9BDBE; }
.ms.m { background: #C0453B; color: #fff; }
.ms.s { background: #D7B23C; color: #1C1A10; }
.fader { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 22px; background: transparent; }
.fader::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(#1C1D1E, #2B2D2E); border: 1px solid #161718; }
.fader::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 20px; margin-top: -8px; border-radius: 2px; background: linear-gradient(90deg, #C9CDCE, #F2F4F4 50%, #B7BBBC); border: 1px solid #111; }
.fader::-moz-range-track { height: 6px; border-radius: 3px; background: #1C1D1E; }
.fader::-moz-range-thumb { width: 14px; height: 20px; border-radius: 2px; background: #E4E7E7; border: 1px solid #111; }
.fader.small { width: 110px; flex: none; }
.vtxt { min-width: 6ch; }
.grbar { flex: 1; height: 4px; background: rgba(255,255,255,.07); border-radius: 2px; overflow: hidden; max-width: 60px; }
.grbar i { display: block; height: 100%; width: 0; background: var(--tc); }
#tlwrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#tl { position: absolute; inset: 0; touch-action: none; display: block; }

/* master strip (like the Reaper mixer master) */
#mstrip { background: var(--tcp2); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#mtitle { background: #2A2C2D; border: 0; border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; font-weight: 700; font-size: 11.5px; letter-spacing: .06em; }
#mfx { display: flex; flex-direction: column; background: #1F2122; border-bottom: 1px solid var(--line); }
.mfxrow { display: flex; align-items: center; gap: 5px; padding: 0 6px; border-bottom: 1px solid #2A2C2D; }
.mfxrow button { flex: 1; text-align: left; border: 0; background: none; padding: 6px 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mfxrow.off button { color: var(--dim); text-decoration: line-through; }
.results .rrow { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--line2); border-radius: 6px; background: #26282A; }
.rhead { display: flex; align-items: center; gap: 10px; }
.rname { flex: 1; min-width: 0; font-size: 12.5px; word-break: break-all; }
.rplay { width: 40px; justify-content: center; }
.rwavewrap { position: relative; }
.rwave { width: 100%; height: 56px; display: block; border-radius: 4px; --p: 0%; }
.rwavewrap::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--p, 0%); width: 2px; background: #fff; opacity: .85; pointer-events: none; }
.btn.big { padding: 10px 14px; font-size: 14px; }
.mbyp { margin: 6px; padding: 6px 8px; border-radius: 3px; border: 1px solid var(--line); background: var(--btn); font-size: 11.5px; font-weight: 600; color: #D9DCDC; }
.mbyp.on { background: #8A3A32; border-color: #B5554A; color: #fff; }
#bLoop.on { background: #6B5A1E; border-color: #D9B53C; color: #FFE7A0; }
.speed .btn.sp { padding: 5px 8px; min-width: 44px; justify-content: center; font-family: var(--f-mono); font-size: 12px; }
.seg2.small button { padding: 5px 9px; font-size: 11px; }
.mfxrow input, .fxrow input { accent-color: var(--fxon); width: 15px; height: 15px; flex: none; }
.dotfx { width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.dotfx::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--fxon); }
.mmeter { flex: 1; min-height: 120px; padding: 8px 10px; display: flex; }


/* context bar */
.ctxbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 10px; background: var(--bar2); border-top: 1px solid var(--line); min-height: 44px; }
.cgrp { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
.cgrp b { color: var(--fg); }
.cname { max-width: 22ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hint { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--dim); font-size: 12px; }
.hint b { color: var(--fg); }
.btn { color: var(--fg); border: 1px solid var(--line); background: var(--btn); border-radius: 3px; padding: 6px 10px; font-size: 12.5px; text-decoration: none; display: inline-flex; align-items: center; min-height: 32px; white-space: nowrap; }
.btn:hover { background: var(--btn2); }
.btn.small { padding: 3px 8px; min-height: 26px; font-size: 12px; }
.btn.primary { background: #3E7F6D; border-color: #5BA48F; color: #fff; font-weight: 600; }
.btn.danger { color: #FF9A8C; }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; }
.num, .txt { background: #1E2021; border: 1px solid var(--line2); border-radius: 3px; padding: 4px 6px; color: var(--fg); min-width: 0; }
.num { font-family: var(--f-mono); font-size: 12px; }

/* transport */
.transport { display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: var(--bar); border-top: 1px solid var(--line); flex-wrap: wrap; }
.tgrp { display: flex; align-items: center; gap: 3px; }
#bPlay { width: 44px; background: #DDE1E1; color: #1A1B1C; border-color: #111; }
#bPlay.on { background: #3FAF63; color: #fff; }
.tclock { display: flex; flex-direction: column; background: #121314; border: 1px solid #000; border-radius: 3px; padding: 2px 10px; min-width: 132px; }
#time { font: 500 18px var(--f-mono); color: #E7F0EC; letter-spacing: .02em; line-height: 1.2; }
#tstate { font-size: 10px; color: var(--dim); }
.tmeter { display: flex; align-items: center; gap: 10px; }
#meterT { width: 150px; height: 16px; }
.mvals { display: grid; grid-template-columns: repeat(4, auto); gap: 0 10px; font-size: 10px; color: var(--dim); }
.mvals b { display: block; font: 500 12px var(--f-mono); color: var(--fg); min-width: 5ch; }
#bMaster { display: none; }

/* modal & fx window */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(780px, 100%); max-height: 100%; display: flex; flex-direction: column; background: #2E3031; border: 1px solid #111; border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.6); -webkit-user-select: text; user-select: text; }
.sheet header { display: flex; align-items: center; padding: 10px 12px; background: #3A3C3D; border-bottom: 1px solid #111; border-radius: 6px 6px 0 0; }
.sheet h2 { margin: 0; font-size: 14px; flex: 1; }
.sheetBody { overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.sheetBody h4 { margin: 6px 0 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.sheet footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid #111; flex-wrap: wrap; }
.x { border: 0; background: none; color: var(--dim); font-size: 22px; line-height: 1; padding: 0 6px; }
.fxwin { width: min(1080px, 100%); height: min(760px, 100%); display: flex; flex-direction: column; background: #2B2D2E; border: 1px solid #0E0F10; border-radius: 6px; overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,.65); }
.fxtitle { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; background: linear-gradient(#D9DBDC, #C3C6C7); color: #2B2D2E; font-size: 12.5px; font-weight: 600; }
.fxtitle span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fxtitle .x { color: #444; }
.fxbody { flex: 1; display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 0; }
.fxlist { background: #1F2122; border-right: 1px solid #0E0F10; overflow: auto; }
.fxrow { display: flex; align-items: center; gap: 7px; padding: 8px 9px; border-bottom: 1px solid #2A2C2D; font-size: 12.5px; cursor: pointer; }
.fxrow.sel { background: var(--sel); color: #fff; }
.fxrow.off span { color: var(--dim); text-decoration: line-through; }
.fxnote { margin: 8px 10px; font-size: 11px; color: var(--dim); }
.fxgui { overflow: auto; background: #18191A; min-width: 0; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 14px; }
.checks small { color: var(--dim); }
.tog { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.tog input { width: 17px; height: 17px; accent-color: var(--fxon); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg label { display: flex; }
.seg input { position: absolute; opacity: 0; }
.seg span { border: 1px solid var(--line2); border-radius: 3px; padding: 6px 12px; cursor: pointer; }
.seg input:checked + span { border-color: var(--accent); color: var(--accent); background: rgba(98,214,185,.08); }
.note { margin: 0; color: var(--dim); font-size: 12px; max-width: 72ch; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tablewrap { overflow-x: auto; }
.stats { border-collapse: collapse; width: 100%; font-size: 12px; }
.stats th { text-align: left; color: var(--dim); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line2); white-space: nowrap; }
.stats td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.05); white-space: nowrap; }
.files { display: flex; flex-direction: column; gap: 6px; }
.frow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
.frow .mono { font-size: 12px; word-break: break-all; flex: 1; min-width: 0; }
.frow.cur .plink { color: var(--accent); }
.plink { background: none; border: 0; padding: 0; font-weight: 600; text-align: left; flex: 1; min-width: 0; }
.confirm { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--bad); }
.ctl { display: grid; grid-template-columns: 1fr; gap: 4px; font-size: 12px; }
.ctl > span { color: var(--dim); }
.raocard { border: 1px solid var(--line2); border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: #26282A; }
.raoName { font-size: 12px; word-break: break-all; }
#toast { position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: #E9ECEC; color: #1A1B1C; padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 30px rgba(0,0,0,.4); max-width: calc(100% - 32px); }

/* ===== controls ===== */
.knob { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; touch-action: none; }
.knob svg { display: block; cursor: ns-resize; touch-action: none; overflow: visible; }
.knob .ktrack { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 5; }
.knob .karc { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; }
.knob .kg0 { stop-color: #5A5E60; } .knob .kg1 { stop-color: #262829; }
.knob .kbody { stroke: #0C0D0E; stroke-width: 1.5; }
.knob .kptr line { stroke: #F2F4F4; stroke-width: 5; stroke-linecap: round; }
.knob .lab text { font: 600 7.5px var(--f-ui); fill: #CDD0D0; }
.kval { font-size: 11px; color: var(--fg); }
.klab { font-size: 10px; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
.k-tcp .ktrack { stroke-width: 8; } .k-tcp .karc { stroke-width: 8; stroke: #9FC4E8; } .k-tcp .kbody { r: 28; } .k-tcp .kptr line { stroke-width: 9; }
.vslider { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.vlab { font-size: 11px; letter-spacing: .06em; color: #D8DCDC; text-transform: uppercase; }
.vtrack { position: relative; width: 34px; border-radius: 4px; background: #15181A; border: 1px solid #000; touch-action: none; cursor: ns-resize; }
.vfill { position: absolute; left: 14px; right: 14px; bottom: 0; background: rgba(255,255,255,.12); border-radius: 3px; }
.vthumb { position: absolute; left: -6px; right: -6px; height: 18px; border-radius: 3px; background: linear-gradient(#EEF0F0, #B7BBBD); border: 1px solid #111; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
.vthumb::after { content: ""; position: absolute; left: 4px; right: 4px; top: 8px; height: 2px; background: #333; }
.vval { font-size: 12px; min-width: 5ch; text-align: center; }
.dnum { cursor: ns-resize; padding: 1px 3px; border-radius: 3px; touch-action: none; font-size: 13px; }
.dnum:hover { background: rgba(255,255,255,.06); }
.dinput { width: 6em; }
.seg2 { display: inline-flex; border: 1px solid #0E0F10; border-radius: 4px; overflow: hidden; }
.seg2 button { border: 0; background: #2E3133; padding: 6px 12px; font-size: 11.5px; font-weight: 600; color: #AEB3B4; border-right: 1px solid #0E0F10; }
.seg2 button:last-child { border-right: 0; }
.seg2 button.on { background: #4B5053; color: #fff; }
.pwr { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #0B0C0D; background: #2A2D2F; color: #6A7072; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.pwr.on { color: #7EE3A0; box-shadow: 0 0 10px rgba(126,227,160,.35); }

/* ===== plugin shells ===== */
.pl { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
.plhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.plhead b { font-size: 15px; letter-spacing: .02em; }
.plhead .dim { font-size: 11.5px; }

/* EQ */
.pl-eq { background: #121820; }
.eqc { width: 100%; height: 250px; border-radius: 4px; border: 1px solid #222B36; touch-action: none; display: block; }
.eqlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 4px 12px; }
.eqrow { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 4px; font-size: 12px; white-space: nowrap; border-left: 3px solid var(--bc); background: rgba(255,255,255,.02); }
.eqrow.sel { background: rgba(255,255,255,.07); }
.eqrow b { font: 700 11px var(--f-mono); width: 1.2em; color: var(--bc); }
.eqrow .ty { background: #1E2631; border: 1px solid #2B3644; border-radius: 3px; padding: 3px 4px; font-size: 12px; }
.eqrow input[type=checkbox] { accent-color: var(--bc); }

/* De-crackle */
.pl-rx { background: linear-gradient(#22272E, #1A1E23); }
.pl-rx .plhead b { color: #CFE3F2; }
.rxtag { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #6FB7E8; border: 1px solid #355A75; border-radius: 3px; padding: 2px 6px; }
.rxbody { display: flex; flex-direction: column; gap: 14px; background: #262C34; border: 1px solid #323A44; border-radius: 6px; padding: 16px; max-width: 620px; }
.rxrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rxl { width: 9em; color: #A9B6C2; font-size: 12px; }
.rxrow input[type=checkbox] { width: 17px; height: 17px; accent-color: #4AA8E8; }
.hrange { -webkit-appearance: none; appearance: none; flex: 1; min-width: 160px; height: 24px; background: transparent; }
.hrange::-webkit-slider-runnable-track { height: 4px; background: #3E4955; border-radius: 2px; }
.hrange::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #4AA8E8; border: 2px solid #CFE3F2; }
.pl-rx .seg2 button.on { background: #2E6C96; }

/* Vocal leveler */
.pl-rv { background: linear-gradient(#41484E, #2C3236); }
.rvsub { font-size: 11px; color: #AEB8BE; letter-spacing: .04em; }
.rvbody { display: flex; align-items: flex-end; justify-content: center; gap: 28px; padding: 18px; background: linear-gradient(#2E3438, #23282B); border: 1px solid #15191B; border-radius: 6px; flex-wrap: wrap; }
.rv .vtrack { width: 30px; background: repeating-linear-gradient(#11151A 0 13px, #2B3239 13px 14px); }
.rv.big .vtrack { width: 40px; }
.rv .vthumb { background: linear-gradient(#F4D58A, #C7A04B); }
.rvcol { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.rvled { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: #AEB8BE; text-transform: uppercase; }
.led { width: 9px; height: 9px; border-radius: 50%; background: #3A2A20; border: 1px solid #000; }
.led.on { background: #FF9A3C; box-shadow: 0 0 8px #FF9A3C; }
.rvmeters { display: flex; gap: 10px; align-items: flex-end; }
.rvmeters > div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10.5px; color: #AEB8BE; }
.rvmeter { width: 16px; height: 200px; border: 1px solid #000; border-radius: 2px; }

/* De-esser */
.pl-ds { background: #2A2C2F; }
.dslogo { font-weight: 300 !important; font-size: 20px !important; color: #D6E36B; letter-spacing: .02em; }
.dstop { display: grid; grid-template-columns: 1fr 34px; gap: 6px; }
.dshist { width: 100%; height: 170px; border-radius: 4px; border: 1px solid #111; display: block; }
.dsgr { width: 34px; height: 170px; border-radius: 3px; border: 1px solid #111; display: block; }
.dsctl { display: grid; grid-template-columns: auto minmax(220px, 1fr) auto; gap: 16px; align-items: center; background: #333538; border: 1px solid #1B1C1E; border-radius: 6px; padding: 14px; }
.dsknobs { display: flex; gap: 14px; align-items: flex-end; }
.dsknobs.small { gap: 10px; }
.dsmid { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.dslab { font-size: 10px; letter-spacing: .12em; color: #8B9095; text-align: center; }
.dsseg { display: flex; } .dsseg button { flex: 1; }
.dsseg button.on { background: #4A4D52; box-shadow: inset 0 -3px 0 #E8B53C; }
.dsband { position: relative; height: 28px; border-radius: 4px; background: linear-gradient(90deg, #1F2023, #26282B); border: 1px solid #111; touch-action: none; }
.dsfill { position: absolute; top: 3px; bottom: 3px; background: linear-gradient(90deg, #E5B93C, #F2D36A); border-radius: 3px; opacity: .9; }
.dsh { position: absolute; top: -2px; width: 18px; height: 30px; margin-left: -9px; border-radius: 4px; background: linear-gradient(#ECECEC, #A9AAAC); border: 1px solid #222; cursor: ew-resize; touch-action: none; }
.dsfreq { display: flex; justify-content: space-between; font-size: 11.5px; color: #E8B53C; }
.k-fab .kg0 { stop-color: #FFD978; } .k-fab .kg1 { stop-color: #C88E1E; }
.k-fab .kbody { stroke: #6B4A08; }
.k-fab .karc { stroke: #8BC34A; stroke-width: 6; } .k-fab .ktrack { stroke: #45484B; stroke-width: 6; }
.k-fab .kptr line { stroke: #FFFFFF; stroke-width: 7; }
.k-dsg .kg0 { stop-color: #6E7276; } .k-dsg .kg1 { stop-color: #303235; } .k-dsg .karc { stroke: #D9DCDF; }

/* Saturation */
.pl-sat { background: linear-gradient(#3A2D25, #231B16); }
.satbody { display: flex; justify-content: center; padding: 20px; }
.pl-sat .karc { stroke: #FF9B4A; }

/* Spectral ducker */
.pl-dk { background: #15171A; }
.dkc { width: 100%; height: 200px; border-radius: 4px; border: 1px solid #262A2F; display: block; }
.dkknobs { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; justify-content: center; background: #1C1F23; border: 1px solid #262A2F; border-radius: 6px; padding: 14px; }
.k-sth .kg0 { stop-color: #3A3E44; } .k-sth .kg1 { stop-color: #17191C; } .k-sth .karc { stroke: #FF8A3D; }
.dkrange { display: flex; flex-direction: column; align-items: center; gap: 4px; }

/* Multiband */
.pl-mb { background: linear-gradient(#141C27, #0E141C); gap: 8px; }
.mbhead { padding-bottom: 2px; }
.mblogo { font-weight: 300 !important; font-size: 19px !important; color: #E8F0F8; }
.mbmode { border: 1px solid #2E3B4C; border-radius: 4px; padding: 3px 10px; font-size: 12px; color: #C9D6E4; }
.mbc { width: 100%; height: 190px; border-radius: 4px; border: 1px solid #1E2836; touch-action: none; display: block; }
.mbcols { display: grid; grid-template-columns: repeat(4, minmax(210px, 1fr)); gap: 8px; overflow-x: auto; }
.mbcol { background: #111823; border: 1px solid #1E2836; border-top: 2px solid var(--bc); border-radius: 4px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 210px; }
.mbtop { display: flex; align-items: center; gap: 8px; }
.mbtop b { color: var(--bc); font-size: 12.5px; }
.mbtop small { margin-left: auto; font-size: 10.5px; }

.mbmain { display: grid; grid-template-columns: 70px 1fr; gap: 10px; }

.mbtl { display: flex; flex-direction: column; font-size: 11px; line-height: 1.2; }

.mbm { width: 100%; height: 190px; border: 1px solid #1E2836; border-radius: 3px; touch-action: none; cursor: ns-resize; }
.mbpar { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; align-content: start; font-size: 12px; }
.mbpar b { grid-column: 1 / -1; color: #C9D6E4; font-size: 12px; margin-top: 4px; }
.mbpar small { color: #7F8EA0; align-self: center; }
.mbfoot { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.mbfoot small { color: #7F8EA0; }

/* Opto / discrete comp */
.pl-sh { background: #070708; padding: 0; gap: 0; }
.shbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #0F0F10; border-bottom: 1px solid #1F1F21; }
.shtitle { font: 600 13px var(--f-ui); letter-spacing: .3em; color: #D5D5D5; }
.shpanel { display: grid; grid-template-columns: minmax(140px, auto) minmax(300px, 1.4fr) minmax(290px, auto); gap: 14px; padding: 18px 16px 22px; background: radial-gradient(120% 90% at 50% 0%, #1C1C1E, #08080A); }
.shsec { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.shcap, .shname { font: 600 11px var(--f-ui); letter-spacing: .28em; color: #E6E6E6; }
.shname { text-align: center; letter-spacing: .22em; }
.shgrid { display: grid; grid-template-columns: repeat(3, auto); gap: 10px 14px; justify-items: center; align-items: end; }
.k-sh .kg0 { stop-color: #4E4F53; } .k-sh .kg1 { stop-color: #050506; }
.k-sh .kbody { stroke: #000; stroke-width: 2; }
.k-sh .ktrack, .k-sh .karc { display: none; }
.k-sh .kptr line { stroke: #F4F4F4; stroke-width: 3.2; }
.k-sh .lab text { fill: #E2E2E2; font-size: 8px; }
.k-sh .kval { color: #9BE7D9; }
.k-sh .klab { color: #E2E2E2; letter-spacing: .14em; }
.shcenter { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.vus { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 460px; }
.vus > div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.vus small { font-size: 9.5px; letter-spacing: .16em; color: #9A9A9A; }
.vu { width: 100%; aspect-ratio: 1.55; max-width: 100%; border-radius: 10px; border: 2px solid #000; box-shadow: inset 0 0 0 2px #222, 0 4px 12px rgba(0,0,0,.6); display: block; }
.shmid { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.shxf { display: flex; flex-direction: column; gap: 6px; }
.shxf button { display: flex; align-items: center; gap: 8px; background: none; border: 0; font: 600 10.5px var(--f-ui); letter-spacing: .16em; color: #CFCFCF; padding: 2px 0; }
.shlamp { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #2C3E3B, #0B1110); border: 1px solid #000; flex: none; }
.shlamp.on, .shxf button.on .shlamp { background: radial-gradient(circle at 40% 35%, #DFFFF8, #4FE0C4 45%, #138C77); box-shadow: 0 0 12px #4FE0C4; }
.shst { display: flex; align-items: center; gap: 8px; font: 600 10.5px var(--f-ui); letter-spacing: .16em; color: #CFCFCF; }
.shtg { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.shtg small { font: 600 9.5px var(--f-ui); letter-spacing: .16em; color: #CFCFCF; }
.shtog { width: 54px; height: 26px; border-radius: 13px; border: 1px solid #000; background: linear-gradient(#2A2A2C, #121214); position: relative; font: 700 9px var(--f-ui); color: #BBB; letter-spacing: .1em; }
.shtog i { position: absolute; top: 3px; left: 4px; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(#E8E8E8, #8C8C8C); transition: left .12s; }
.shtog.on i { left: 30px; }
.shtog span { position: absolute; top: 6px; right: 7px; }
.shtog.on span { right: auto; left: 8px; }

/* Opto leveler (cream & silver faceplate) */
.pl-2a { background: #2A2B2C; }
.face2a { background: linear-gradient(#D8D8D2, #B9BAB3); border: 1px solid #77786F; border-radius: 6px; padding: 14px 18px 20px; box-shadow: inset 0 1px 0 #F2F2EC, 0 4px 14px rgba(0,0,0,.5); color: #1F2020; }
.brand2a { display: flex; align-items: baseline; justify-content: center; gap: 14px; margin-bottom: 10px; }
.brand2a span { font: 700 13px var(--f-ui); letter-spacing: .32em; }
.brand2a small { font-size: 10px; letter-spacing: .2em; color: #55564F; }
.row2a { display: grid; grid-template-columns: auto minmax(220px, 1fr) auto; gap: 18px; align-items: center; }
.mid2a { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.vu.va { width: 100%; max-width: 300px; }
.sws2a { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: flex-end; }
.sws2a > div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sws2a small { font: 600 9.5px var(--f-ui); letter-spacing: .16em; color: #3A3B37; }
.sw2a { display: inline-flex; border: 1px solid #55564F; border-radius: 4px; overflow: hidden; background: #9C9D96; }
.sw2a button { border: 0; background: none; padding: 5px 9px; font: 700 10px var(--f-ui); letter-spacing: .06em; color: #2D2E2B; }
.sw2a button.on { background: #262725; color: #F2F0E4; }
.pw2a { flex-direction: row !important; gap: 6px !important; }
.lamp2a { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #6A2A22, #2A0E0B); border: 1px solid #222; }
.lamp2a.on { background: radial-gradient(circle at 40% 35%, #FFD9C9, #F2493A 45%, #8C1810); box-shadow: 0 0 12px #F2493A; }
.k-2a .kg0 { stop-color: #3B3C3E; } .k-2a .kg1 { stop-color: #08090A; }
.k-2a .kbody { stroke: #000; stroke-width: 3; }
.k-2a .ktrack, .k-2a .karc { display: none; }
.k-2a .kptr line { stroke: #F4F2E8; stroke-width: 3.6; }
.k-2a .lab text { fill: #1F2020; font-size: 7.5px; font-weight: 700; }
.k-2a .kval { color: #1F2020; font-weight: 600; }
.k-2a .klab { color: #1F2020; font-weight: 700; letter-spacing: .14em; }

/* Multimaximizer (dark slate left panel, metal-framed band display) */
.pl-l3 { background: #141414; gap: 10px; }
.l3main { display: grid; grid-template-columns: 318px minmax(0, 1fr); gap: 0; border: 1px solid #000; border-radius: 4px; overflow: hidden; }
.l3left { background: linear-gradient(#262626, #1C1C1C); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.l3cols { display: flex; gap: 6px; justify-content: space-between; }
.l3col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.l3cap { font: 400 12.5px var(--f-ui); color: #BDBDBD; letter-spacing: .03em; }
.l3track { position: relative; width: 54px; touch-action: none; cursor: ns-resize; display: flex; justify-content: center; gap: 22px; }
.l3mtr { width: 8px; height: 100%; background: #050505; border: 1px solid #333; display: block; }
.l3rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: #0B0B0B; border: 1px solid #3A3A3A; border-radius: 2px; }
.l3track:not(:has(canvas)) .l3rail { width: 8px; margin-left: -4px; }
.l3badge { position: absolute; left: 50%; transform: translateX(-50%); min-width: 52px; height: 24px; padding: 0 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #E6E6E6; background: linear-gradient(#5A5A5A, #2C2C2C); border: 1.5px solid #D8C55A; border-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.7); }
.l3atwrap { position: relative; width: 50px; display: flex; justify-content: flex-end; }
.l3at { width: 12px; height: 100%; background: #050505; border: 1px solid #333; display: block; }
.l3scale { position: absolute; left: 0; top: 0; bottom: 0; width: 34px; }
.l3scale span { position: absolute; right: 0; transform: translateY(-50%); font: 11px var(--f-mono); color: #BDBDBD; white-space: nowrap; }
.l3ros { display: flex; gap: 6px; }
.l3ro { flex: 1; text-align: center; background: #0B0B0B; border: 1px solid #3A3A3A; padding: 4px 0; font-size: 12.5px; color: #DADADA; border-radius: 2px; }
.l3box2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; background: #1A1A1A; border: 1px solid #333; border-radius: 6px; padding: 8px; text-align: center; }
.l3box2.v { grid-template-columns: 1fr; }
.l3sel { width: 100%; background: linear-gradient(#2E2E2E, #161616); color: #EAEAEA; border: 1px solid #3F3F3F; border-radius: 3px; padding: 5px 6px; font-size: 13px; text-align: center; }
.l3bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; }
.l3logo { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 10px; background: #1A1A1A; border: 1px solid #333; border-radius: 6px; padding: 10px; }
.l3idr { width: 100%; padding: 10px 0; border-radius: 22px; border: 2px solid #3A1010; background: radial-gradient(#3A0E0E, #160606); font: 700 22px var(--f-ui); letter-spacing: .12em; color: #6C2420; }
.l3idr.on { color: #F0402F; text-shadow: 0 0 10px rgba(240,64,47,.6); }
.l3brand { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.l3brand b { font: 800 30px var(--f-ui); letter-spacing: .02em; background: linear-gradient(#F3B35C, #B9621E); -webkit-background-clip: text; background-clip: text; color: transparent; }
.l3brand small { font: 700 9.5px var(--f-ui); letter-spacing: .12em; color: #D7D7D7; margin-top: 4px; }
.l3right { background: linear-gradient(#7C7A74, #5D5B56); padding: 12px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.l3bezel { border-radius: 26px; padding: 12px; background: linear-gradient(#B9B7B0, #6E6C66); box-shadow: inset 0 2px 4px rgba(255,255,255,.4), 0 3px 8px rgba(0,0,0,.6); }
.l3disp { width: 100%; height: 300px; border-radius: 16px; display: block; touch-action: none; border: 2px solid #1A1A1A; }
.l3bands { display: grid; grid-template-columns: auto repeat(6, minmax(52px, 1fr)); gap: 6px; align-items: start; background: linear-gradient(#6E6C67, #57554F); border-radius: 18px 18px 6px 6px; padding: 12px 10px; overflow-x: auto; }
.l3lab { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
.l3lab span { height: 28px; display: flex; align-items: center; font-size: 12.5px; color: #E2E0DA; }
.l3band { display: flex; flex-direction: column; gap: 6px; align-items: stretch; border-top: 3px solid var(--bc); padding-top: 3px; }
.l3num { background: linear-gradient(#5E5E5E, #3A3A3A); border: 1px solid #222; border-radius: 3px; height: 28px; display: flex; align-items: center; justify-content: center; box-shadow: inset 3px 0 0 var(--acc, transparent); }
.l3num .dnum { color: #F0F0F0; font-size: 12px; padding: 1px; }
.l3shape { display: flex; border: 1px solid #222; border-radius: 3px; overflow: hidden; background: #2A2A2A; }
.l3shape button { flex: 1; border: 0; background: none; color: #8A8A8A; padding: 3px 0; }
.l3shape button svg { width: 100%; height: 14px; display: block; }
.l3shape button.on { background: #111; color: #F2F2F2; }
.l3led { align-self: center; width: 44px; height: 14px; border-radius: 3px; border: 1px solid #1B1B1B; background: linear-gradient(#5A5A5A, #2C2C2C); }
.l3led.on { background: linear-gradient(#9AA0A6, #5A5F64); box-shadow: inset 0 0 0 1px #C9CED2; }
.l3exp { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 12px; }
@media (max-width: 760px) { .l3main { grid-template-columns: 1fr; } .l3left { min-width: 0; } .l3disp { height: 220px; } .row2a { grid-template-columns: 1fr; justify-items: center; } }

/* Auto Balance */
.pl-tb { background: linear-gradient(#0F1B2C, #0A121D); }
.tblogo { font-weight: 300 !important; font-size: 20px !important; color: #EAF2FF; letter-spacing: .04em; }
.tbc { width: 100%; height: 240px; border-radius: 6px; border: 1px solid #1C2B40; display: block; }
.tbsl { display: flex; flex-direction: column; gap: 6px; background: rgba(255,255,255,.03); border: 1px solid #1C2B40; border-radius: 6px; padding: 12px; }
.tbrow { display: grid; grid-template-columns: minmax(150px, 220px) 1fr 4.5em; gap: 12px; align-items: center; }
.tbl { display: flex; flex-direction: column; font-weight: 600; color: #DDE7F5; }
.tbl small { font-weight: 400; color: #7F93AE; font-size: 11px; }
.tbr { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; }
.tbr::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #1E3554, #3B6FA8); }
.tbr::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: #F2C94C; border: 2px solid #0A121D; }
.tbr::-moz-range-track { height: 6px; border-radius: 3px; background: #2B4F7C; }
.tbr::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #F2C94C; border: 2px solid #0A121D; }
.tbrow b { text-align: right; color: #F2C94C; }
.mblink { border: 1px solid #2E3B4C; border-radius: 14px; background: none; padding: 3px 12px; font-size: 12px; color: #8FA3BA; }
.mblink.on { border-color: #30B6EE; color: #30B6EE; background: rgba(48,182,238,.1); }
@media (max-width: 760px) { .tbrow { grid-template-columns: 1fr 4em; } .tbrow input { grid-column: 1 / -1; grid-row: 2; } }

/* Sends */
.pl-snd { background: linear-gradient(#142224, #0C1516); }
.sndrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.sndcard { background: #132B2D; border: 1px solid #23474A; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.sndcard.send { background: #17363A; border-color: #2E6B6F; }
.sndcard h5 { margin: 0; font-size: 13px; letter-spacing: .06em; color: #CFF3EC; display: flex; gap: 10px; align-items: baseline; }
.sndcard h5 small { font-weight: 400; color: #77A9A4; font-size: 11px; letter-spacing: 0; }
.sndknobs { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-around; align-items: flex-end; }
.sndir { width: 100%; height: 70px; border-radius: 4px; border: 1px solid #23474A; display: block; }
.k-snd .kg0 { stop-color: #3F5F62; } .k-snd .kg1 { stop-color: #0E1D1F; } .k-snd .karc { stroke: #5ED6BE; } .k-snd .ktrack { stroke: rgba(94,214,190,.15); }
.k-snd.big .karc { stroke: #FFD65A; }

/* R-Compressor */
.pl-rc { background: #1B1E26; }
.rcface { background: linear-gradient(#24324F, #15203A); border: 6px solid #9EA3AA; border-radius: 8px; padding: 14px 18px; box-shadow: inset 0 0 0 2px #0A0F1C, 0 4px 14px rgba(0,0,0,.6); color: #E8ECF4; }
.rctop { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
.rclamp { display: flex; align-items: center; gap: 8px; background: none; border: 0; font: 400 15px var(--f-ui); color: #E8ECF4; }
.rclamp i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #3A3F48; background: radial-gradient(circle at 40% 35%, #5C5326, #241F0A); }
.rclamp.on i { background: radial-gradient(circle at 40% 35%, #FFF3A6, #E8C33A 50%, #8A6A0C); box-shadow: 0 0 10px rgba(232,195,58,.7); }
.rcmt { margin-left: auto; display: flex; flex-direction: column; gap: 6px; }
.rcbox { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; }
.rcmt .rcbox { flex-direction: row; gap: 8px; }
.rcbox .dnum { min-width: 4.6em; text-align: center; background: #05080F; border: 1px solid #5E6670; border-radius: 2px; color: #fff; padding: 2px 6px; }
.rcmain { display: grid; grid-template-columns: 90px 1fr 90px; gap: 16px; margin-top: 14px; }
.rcside { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.rcside small, .rccenter small { color: #C9D0DC; font-size: 12px; }
.rcmeters { position: relative; height: 380px; display: flex; gap: 18px; justify-content: center; width: 100%; }
.rcm { width: 8px; height: 100%; display: block; border-left: 1px solid #C9302A; border-right: 1px solid #C9302A; }
.rcmark { position: absolute; left: 50%; transform: translate(10px, -50%); z-index: 2; }
.rcmark.r { left: auto; right: 50%; transform: translate(-10px, -50%); }
.rccenter { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.rcar { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; }
.rcar .rcbox { width: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.25) 20%, rgba(255,255,255,.25) 80%, transparent) no-repeat center 70% / 100% 1px; }
.rcatwrap { position: relative; width: 100px; height: 300px; }
.rcat { width: 100px; height: 300px; border: 1px solid #3A4A7A; display: block; }
.rcmark.c { left: 0; top: 52%; transform: translate(-110%, -50%); }

/* Bus compressor */
.pl-gl { background: #1C1D1F; }
.glface { background: linear-gradient(#3A3C40, #26282B); border: 1px solid #0E0F10; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.glvu { width: min(340px, 100%); }
.vu.gl { width: 100%; }
.glknobs { display: flex; flex-wrap: wrap; gap: 14px 18px; justify-content: center; align-items: flex-end; }
.k-glue .kg0 { stop-color: #8C9196; } .k-glue .kg1 { stop-color: #2E3134; } .k-glue .karc { stroke: #E2473A; } .k-glue .lab text { fill: #CFCFCF; }
.glbtn { border: 1px solid #0E0F10; background: #2E3134; color: #9AA0A6; border-radius: 4px; padding: 7px 14px; font: 700 11px var(--f-ui); letter-spacing: .1em; }
.glbtn.on { background: #E2473A; color: #fff; }
@media (max-width: 760px) { .rcmain { grid-template-columns: 60px 1fr 60px; } .rcmeters { height: 260px; } .rcatwrap, .rcat { height: 220px; } .rcmark.c { position: static; transform: none; } }

/* Stats */
.pl-st { background: #1A1C1D; }
.stgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.strow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; background: #232526; border: 1px solid #2F3233; border-radius: 4px; padding: 10px 12px; }
.strow b { font-size: 18px; }

/* responsive */
@media (max-width: 1000px) {
  .main { grid-template-columns: 190px minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .main { grid-template-columns: 126px minmax(0, 1fr); }
  .tcp { grid-template-columns: 1fr 26px; }
  .tnum { display: none; }
  .tmain { padding: 4px 4px 4px 7px; gap: 3px; }
  .tname { font-size: 11.5px; padding: 3px 4px; flex-basis: 100%; }
  .tmain > .trow:first-child { flex-wrap: wrap; }
  .fxb { width: 28px; } .addb { width: 24px; }
  .trow.sub { display: none; }
  .tcp.master .trow.sub { display: flex; }
  .tcpTop small, .tcpTop span { display: none; }
  .addtrack { margin-left: 0; width: 100%; padding: 0 4px; font-size: 11.5px; }
  .tcp { min-width: 0; }
  .hide-s { display: none !important; }
  #meterT { width: 80px; }
  .mvals { grid-template-columns: repeat(2, auto); }
  .fxbody { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .fxlist { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid #0E0F10; }
  .fxrow { flex: none; border-bottom: 0; border-right: 1px solid #2A2C2D; }
  .fxnote { display: none; }
  .fxwin { height: 100%; }
  .dsctl { grid-template-columns: 1fr; justify-items: center; }
  .shpanel { grid-template-columns: 1fr; }
  .mbcols { grid-template-columns: repeat(4, 220px); }
  .eqlist { grid-template-columns: 1fr; }
  .eqc { height: 200px; }
}
@media (prefers-reduced-motion: reduce) { .shtog i { transition: none; } }

<div class="app">
  <header class="top">

    <span class="sep"></span>

    <button class="tb" id="bDel" title="Удалить (Delete)">Удалить</button>
    <button class="tb" id="bCopy" title="Копировать (⌘C)">Копировать</button>
    <button class="tb" id="bCut" title="Вырезать (⌘X)">Вырезать</button>
    <button class="tb" id="bPaste" title="Вставить в позицию курсора (⌘V)">Вставить</button>
    <button class="tb" id="bRipple" title="Удаление со сдвигом следующих клипов">Ripple</button>
    <button class="tb" id="bSnap" title="Прилипание к краям клипов, регионов и курсору">Snap</button>
    <button class="tb" id="bMulti" title="Мультивыбор: тап добавляет клип к выделению">⧉ Выбор</button>

    <span class="sep"></span>
    <button class="tb" id="bZout" aria-label="Отдалить">−</button>

    <button class="tb" id="bZin" aria-label="Приблизить">+</button>

    <button class="tb" id="bPresets">Пресеты</button>
    <button class="tb" id="bConvert">→ MP3</button>
    <button class="tb" id="bRao">РАО</button>

      <button class="tb" id="bPlay" aria-label="Играть"></button>

    </div>

</div>
