<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Эфир</title>
<meta name="description" content="Монтаж и сведение радиороликов: 4 дорожки, регионы 5/10/15/30, экспорт WAV и MP3">
<meta name="theme-color" content="#111416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Эфир">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Тёмная студийная консоль: одна тема намеренно. Янтарь = лампа «В эфире», регионы и выделение. */
:root {
  color-scheme: dark;
  --bg: #111416;
  --panel: #171B1E;
  --panel2: #1D2226;
  --lane: #14181A;
  --lane2: #161A1D;
  --line: #2A3135;
  --grid: rgba(255,255,255,.045);
  --fg: #E6E8E6;
  --dim: #87918F;
  --accent: #F0B13C;
  --play: #FF5A47;
  --ok: #69C98F;
  --bad: #FF6B57;
  --f-ui: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 7px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--f-ui);
  overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.ok { color: var(--ok); } .bad { color: var(--bad); }

.app {
  height: 100%; display: grid; grid-template-rows: auto 1fr auto;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
/* top bar */
.top {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 7px 10px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; margin-right: 4px; }
.lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); flex: none; }
#projName { background: none; border: 0; padding: 4px 2px; font-weight: 600; max-width: 22ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp { display: flex; align-items: center; gap: 3px; padding: 2px; background: var(--panel2); border-radius: 9px; }
.tb {
  min-width: 38px; height: 36px; padding: 0 10px; border: 0; border-radius: var(--r); background: transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap;
}
.tb:hover { background: rgba(255,255,255,.06); }
.tb:disabled { opacity: .35; cursor: default; }
.tb.on { background: rgba(240,177,60,.16); color: var(--accent); }
.tb svg { width: 18px; height: 18px; }
#bPlay { width: 46px; background: var(--fg); color: var(--bg); }
#bPlay.on { background: var(--play); color: #fff; }
#time { font-family: var(--f-mono); font-size: 15px; min-width: 9ch; padding: 0 8px; letter-spacing: .02em; }
.spacer { flex: 1; }
.meterbox { display: grid; grid-template-columns: 110px auto; gap: 2px 10px; align-items: center; padding: 3px 10px; background: var(--panel2); border-radius: 9px; }
#meter { width: 110px; height: 19px; grid-row: span 2; }
.mvals { display: grid; grid-template-columns: repeat(4, auto); gap: 0 10px; font-size: 10px; color: var(--dim); }
.mvals b { display: block; font: 500 12px var(--f-mono); color: var(--fg); font-variant-numeric: tabular-nums; min-width: 5ch; }
.primaryBtn { background: var(--accent); color: #1B1408; font-weight: 600; }
.primaryBtn:hover { background: #F6C35F; }

/* main */
.main { display: grid; grid-template-columns: 136px 1fr; min-height: 0; }
#heads { background: var(--panel); border-right: 1px solid var(--line); overflow: hidden; }
.headTop { display: flex; align-items: center; padding: 0 8px; border-bottom: 1px solid var(--line); }
.chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
.head { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); }
.head::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tc); }
.head.active { background: rgba(255,255,255,.04); }
.head.muted .tname { opacity: .45; }
.tname { text-align: left; background: none; border: 0; padding: 0; font-weight: 600; font-size: 13px; line-height: 1.2; }
.hrow { display: flex; gap: 4px; }
.ms { width: 30px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); font: 600 11px var(--f-mono); }
.ms.m { background: #6E7C82; color: #111; border-color: transparent; }
.ms.s { background: var(--accent); color: #111; border-color: transparent; }
.ms.add { font-size: 17px; font-family: var(--f-ui); font-weight: 500; color: var(--tc); }
.grbar { height: 4px; background: rgba(255,255,255,.06); border-radius: 2px; overflow: hidden; }
.grbar i { display: block; height: 100%; width: 0; background: var(--tc); transition: width .08s linear; }
#tlwrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#tl { position: absolute; inset: 0; touch-action: none; display: block; }

/* inspector */
#insp { background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; max-height: 42vh; }
#insp.collapsed #inspBody { display: none; }
.inspHead { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
#inspTitle { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
#inspBody { overflow: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 12px; -webkit-user-select: text; user-select: text; }
.hint { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 6px 22px; color: var(--dim); font-size: 13px; }
.hint p { margin: 0; max-width: 62ch; }
.hint b { color: var(--fg); }
.meta { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 8px 24px; }
.ctl { display: grid; grid-template-columns: 8.5em minmax(90px, 1fr) 5.2em; align-items: center; gap: 8px; font-size: 12px; min-width: 0; }
.ctl.wide { grid-template-columns: 1fr; }
.ctl > span { color: var(--dim); }
.ctl output { font: 500 12px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.ctl select, .txt, .num { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; min-width: 0; }
.num { font-family: var(--f-mono); font-size: 12px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; min-width: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--fg); border: 0; }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--fg); border: 0; }
.tog { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.tog input { width: 18px; height: 18px; accent-color: var(--accent); }
.sec { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.sec h3 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.note { margin: 0; color: var(--dim); font-size: 12px; max-width: 70ch; }
.note b { color: var(--fg); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { color: var(--fg); border: 1px solid var(--line); background: var(--panel2); border-radius: var(--r); padding: 8px 12px; font-size: 13px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; min-height: 36px; }
.btn:hover { border-color: #3B4448; }
.btn.small { padding: 4px 10px; min-height: 30px; font-size: 12px; }
.btn.primary { background: var(--accent); color: #1B1408; border-color: transparent; font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; }

/* EQ */
.eq { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; }
.eqc { width: 100%; height: 170px; background: #0E1113; border: 1px solid var(--line); border-radius: var(--r); touch-action: none; }
.eqlist { display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow-x: auto; }
.eqrow { display: flex; align-items: center; gap: 5px; padding: 3px 6px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
.eqrow.sel { background: rgba(255,255,255,.05); }
.eqrow b { font: 600 11px var(--f-mono); width: 1.2em; color: var(--dim); }
.eqrow small { color: var(--dim); font-size: 10px; margin-left: -2px; }
.eqrow .ty { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; font-size: 12px; }
.eqrow input[type=checkbox] { accent-color: var(--accent); }
.eqrow .num { padding: 3px 5px; }
.x { border: 0; background: none; color: var(--dim); font-size: 20px; line-height: 1; padding: 0 6px; }

.rao { border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--panel2); }
.raoName { font-size: 12px; word-break: break-all; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(5,7,8,.6); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); -webkit-user-select: text; user-select: text; }
.sheet header { display: flex; align-items: center; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.sheet h2 { margin: 0; font-size: 16px; flex: 1; text-wrap: balance; }
.sheetBody { overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.sheetBody h4 { margin: 6px 0 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.sheet footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; }
.checks small { color: var(--dim); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg label { display: flex; }
.seg input { position: absolute; opacity: 0; }
.seg span { border: 1px solid var(--line); border-radius: var(--r); padding: 7px 12px; cursor: pointer; font-size: 13px; }
.seg input:checked + span { border-color: var(--accent); color: var(--accent); background: rgba(240,177,60,.08); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }
.tablewrap { overflow-x: auto; }
.stats { border-collapse: collapse; width: 100%; font-size: 12px; }
.stats th { text-align: left; color: var(--dim); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.stats td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.04); white-space: nowrap; }
.files { display: flex; flex-direction: column; gap: 6px; }
.frow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
.frow .mono { font-size: 12px; word-break: break-all; flex: 1; min-width: 0; }
.frow.cur .plink { color: var(--accent); }
.plink { background: none; border: 0; padding: 0; font-weight: 600; text-align: left; flex: 1; min-width: 0; }
.confirm { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--bad); }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 30px rgba(0,0,0,.4); max-width: calc(100% - 32px); }

@media (max-width: 760px) {
  .top { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 6px 8px; }
  .top::-webkit-scrollbar { display: none; }
  .top > * { flex: none; }
  #projName { max-width: 12ch; }
  .main { grid-template-columns: 96px 1fr; }
  .head { padding-left: 9px; }
  .tname { font-size: 12px; }
  .ms { width: 26px; height: 26px; }
  .hide-s { display: none !important; }
  .meterbox { grid-template-columns: 70px auto; }
  #meter { width: 70px; }
  .mvals { grid-template-columns: repeat(2, auto); }
  .eq { grid-template-columns: 1fr; }
  .ctl { grid-template-columns: 8em 1fr 5em; }
  #insp { max-height: 46vh; }
}
@media (prefers-reduced-motion: reduce) { .grbar i { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="lamp" aria-hidden="true"></span><button id="projName" aria-label="Проекты">Проект</button></div>
    <div class="grp">
      <button class="tb" id="bHome" aria-label="В начало"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM9.5 12 19 5v14z" fill="currentColor"/></svg></button>
      <button class="tb" id="bPlay" aria-label="Играть"></button>
      <span id="time">0:00.000</span>
    </div>
    <div class="grp">
      <button class="tb" id="bSplit" title="Разрезать по курсору (S)">Разрезать</button>
      <button class="tb" id="bDel" title="Удалить (Delete)">Удалить</button>
      <button class="tb" id="bRipple" title="Удаление со сдвигом следующих клипов">Сдвиг</button>
      <button class="tb" id="bSnap" title="Прилипание к краям клипов, регионов и курсору">Магнит</button>
    </div>
    <div class="grp">
      <button class="tb" id="bUndo" aria-label="Отменить" title="Отменить (⌘Z)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H4V2M4.5 7A8 8 0 1 1 6 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="tb" id="bRedo" aria-label="Повторить" title="Повторить (⇧⌘Z)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7h5V2M19.5 7A8 8 0 1 0 18 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="grp hide-s">
      <button class="tb" id="bZout" aria-label="Отдалить">−</button>
      <button class="tb" id="bFit" title="Показать всё">Всё</button>
      <button class="tb" id="bZin" aria-label="Приблизить">+</button>
    </div>
    <div class="spacer"></div>
    <div class="meterbox" title="Выход мастера">
      <canvas id="meter" aria-label="Индикатор уровня"></canvas>
      <div class="mvals">
        <span>RMS 3с<b id="mRms">—</b></span>
        <span>RMS-I<b id="mRmsI">—</b></span>
        <span class="hide-s">Пик<b id="mPk">—</b></span>
        <span class="hide-s">Лимит<b id="mGr">—</b></span>
      </div>
    </div>
    <div class="grp">
      <button class="tb" id="bRao">РАО</button>
      <button class="tb hide-s" id="bProj">Проекты</button>
      <button class="tb primaryBtn" id="bExport">Экспорт</button>
    </div>
  </header>
  <div class="main">
    <div id="heads"></div>
    <div id="tlwrap"><canvas id="tl" aria-label="Таймлайн"></canvas></div>
  </div>
  <section id="insp">
    <div class="inspHead">
      <h2 id="inspTitle">Подсказки</h2>
      <button class="tb" id="bInsp" aria-label="Свернуть панель">Панель</button>
    </div>
    <div id="inspBody"></div>
  </section>
</div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
